name: Publish release asset

# Creates (or completes) the GitHub Release for the APK committed under build/.
#
#  - push to main touching build/*.apk : the release for that APK's version is
#    created if it does not exist (tag created on GitHub's side from the pushed
#    commit), with RELEASE_NOTES_v<version>.md as its notes and the APK plus
#    SHA256SUMS.txt attached. If it already exists, the assets are replaced.
#  - release published / manual run     : attach the committed APK to that tag.
#
# This runs on GitHub's runners, which can reach uploads.github.com; the
# maintenance sandbox cannot, and cannot create tags either.

on:
  push:
    branches:
      - main
    paths:
      - 'build/*.apk'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the build/ APK (and checksum) to'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release if missing, then attach the APK + checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(find build -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found under build/."
            exit 1
          fi
          tag="${{ github.event.release.tag_name }}${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            ver=$(basename "$apk" | sed -E 's/^ProfessorVPN-v([0-9.]+)-universal\.apk$/\1/')
            tag="v${ver}"
          fi
          echo "Release tag: $tag   APK: $apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" build/SHA256SUMS.txt \
              --repo "${{ github.repository }}" --clobber
          else
            notes="RELEASE_NOTES_${tag}.md"
            [ -f "$notes" ] || { echo "Release $tag" > /tmp/notes.md; notes=/tmp/notes.md; }
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$tag" \
              --notes-file "$notes" \
              "$apk" build/SHA256SUMS.txt
          fi
